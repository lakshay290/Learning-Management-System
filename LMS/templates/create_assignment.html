{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <h2 class="mb-4 text-center">Create Assignment</h2>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow p-4">
                <h5 class="card-title mb-4">
                    <i class="fas fa-tasks"></i> {{ course.title }}
                </h5>

                <form method="POST" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="title" class="form-label">Assignment Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="e.g., Python Basics Quiz" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe the assignment..."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="due_date" class="form-label">Due Date</label>
                            <input type="datetime-local" class="form-control" id="due_date" name="due_date">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="points" class="form-label">Points</label>
                            <input type="number" class="form-control" id="points" name="points" min="0" value="0" placeholder="e.g., 100">
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{% url 'manage_assignments' %}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Create Assignment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
