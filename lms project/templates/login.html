{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>LMS - Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="login-body">

<div class="container-fluid">
    <div class="row vh-100">

        <!-- LEFT SIDE -->
        <div class="col-md-6 left-panel d-flex flex-column justify-content-center align-items-center text-center">
            <h1 class="lms-title">LMS</h1>
            <h3 class="text-white mt-3">Learning Management System</h3>

            <div class="rank-box mt-4">
                <h2>Empowering Education</h2>
                <p>Modern • Secure • Smart</p>
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-6 d-flex justify-content-center align-items-center">

            <div class="login-card p-5">

                <div class="text-center mb-4">
                    <h4 class="fw-bold">Log in</h4>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <!-- EMAIL FIELD -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Enter your email"
                               required>
                    </div>

                    <!-- PASSWORD FIELD -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter your password"
                               required>
                    </div>

                    <button type="submit" class="btn login-btn w-100 mt-2">
                        Login
                    </button>

                </form>

                <div class="text-center mt-3">
                    <a href="#" class="forgot-link">Forgot your password?</a>
                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
